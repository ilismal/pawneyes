# En cada push a main y en cada pull request: tests JVM, lint, compilación y
# tests de paridad Python/Android (con los fixtures públicos) en un emulador.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # El runner ya trae el SDK; el plugin de Android descarga lo que falte
      # (plataforma, build-tools) una vez aceptadas las licencias.
      - name: Licencias del SDK de Android
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)" --licenses > /dev/null || true
      - name: NDK (para compilar Stockfish)
        run: |
          ndk=$(grep '^ndk = ' android/gradle/libs.versions.toml | cut -d'"' -f2)
          "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)" --install "ndk;$ndk" > /dev/null
      - name: Tests JVM, lint y APK de depuración
        working-directory: android
        run: >
          ./gradlew :core:chess:test :vision:testDebugUnitTest :engine:testDebugUnitTest
          :feature:camera:testDebugUnitTest :feature:board:testDebugUnitTest :maia:testDebugUnitTest :app:testDebugUnitTest
          lintDebug :app:assembleDebug
      - name: Librerías nativas alineadas a 16 KB
        run: python3 android/scripts/check_16kb.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Informes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes
          path: android/**/build/reports/

  paridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Licencias del SDK de Android
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)" --licenses > /dev/null || true
      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Solo el módulo vision: Stockfish existe solo para ARM64 y el emulador del runner es x86_64.
      - name: Tests de paridad en emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew :vision:connectedDebugAndroidTest
