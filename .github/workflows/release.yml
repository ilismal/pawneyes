# Al publicar una etiqueta vX.Y.Z, compila la APK firmada y la adjunta a la
# release de GitHub (de ahí la descarga Obtainium).
#
# Las notas de la release son el mensaje de la etiqueta anotada, en Markdown:
#   git tag -a v0.3.0 -F notas.md && git push origin v0.3.0
# Si la etiqueta no trae notas, la release falla en vez de publicarse sin ellas.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 de android/release.jks
#   KEYSTORE_PASSWORD  contraseña del almacén
#   KEY_ALIAS          alias de la clave (pawneyes)
#   KEY_PASSWORD       contraseña de la clave
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notas de la release (mensaje de la etiqueta)
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notas.md
          # Una etiqueta sin notas (o con solo el título) no se publica.
          if [ "$(grep -c . notas.md)" -lt 2 ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no trae notas de la release (git tag -a $GITHUB_REF_NAME -F notas.md)"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # El runner ya trae el SDK; el plugin de Android descarga lo que falte
      # (plataforma, build-tools) una vez aceptadas las licencias.
      - name: Licencias del SDK de Android
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)" --licenses > /dev/null || true

      - name: NDK (para compilar Stockfish)
        run: |
          ndk=$(grep '^ndk = ' android/gradle/libs.versions.toml | cut -d'"' -f2)
          "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)" --install "ndk;$ndk" > /dev/null

      # Sin keystore.properties, Gradle deja la APK sin firmar: la clave no pasa por Gradle
      # (ni por sus plugins y dependencias), solo por el paso de firma.
      - name: Tests y APK sin firmar
        working-directory: android
        run: |
          ./gradlew :core:chess:test :vision:testDebugUnitTest :engine:testDebugUnitTest \
            :feature:camera:testDebugUnitTest :feature:board:testDebugUnitTest :maia:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease \
            -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="${{ github.run_number }}"
          ./gradlew --stop

      # La clave está en disco solo durante este paso. Las contraseñas llegan a apksigner por
      # variables de entorno, no por la línea de órdenes. El certificado debe ser el de siempre:
      # con otro, Obtainium y Android no podrían actualizar la app instalada.
      - name: Firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CERT_SHA256: 87938e8fb8ac8d24e287cd131a45609f9711a8a3f77bd786acffd44dfc4315d9
        run: |
          APK="pawneyes-${GITHUB_REF_NAME#v}.apk"
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$APK" android/app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$ks"
          # Todas las firmas con ese certificado. El formato de la salida cambia entre versiones de
          # apksigner («Signer #1 certificate…», «V3.0 Signer: certificate…»): se toma solo la huella.
          certs="$("$apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)"
          if [ "$certs" != "$CERT_SHA256" ]; then
            echo "::error::$APK no está firmada con el certificado de siempre: ${certs:-ninguno}"
            exit 1
          fi
          # apksigner no alinea: las .so sin comprimir deben seguir en páginas de 16 KB dentro del ZIP.
          "$(dirname "$apksigner")/zipalign" -c -P 16 4 "$APK"
          python3 android/scripts/check_16kb.py "$APK"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pawneyes-*.apk --verify-tag --title "$GITHUB_REF_NAME" --notes-file notas.md
