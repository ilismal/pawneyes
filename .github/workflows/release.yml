# Al publicar una etiqueta vX.Y.Z, compila la APK firmada y la adjunta a la
# release de GitHub (de ahí la descarga Obtainium).
#
# Las notas de la release son el mensaje de la etiqueta anotada, en Markdown:
#   git tag -a v0.3.0 -F notas.md && git push origin v0.3.0
# Si la etiqueta no trae notas, la release falla en vez de publicarse sin ellas.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 de android/release.jks
#   KEYSTORE_PASSWORD  contraseña del almacén
#   KEY_ALIAS          alias de la clave (pawneyes)
#   KEY_PASSWORD       contraseña de la clave
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Notas de la release (mensaje de la etiqueta)
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notas.md
          # Una etiqueta sin notas (o con solo el título) no se publica.
          if [ "$(grep -c . notas.md)" -lt 2 ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no trae notas de la release (git tag -a $GITHUB_REF_NAME -F notas.md)"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # El runner ya trae el SDK; el plugin de Android descarga lo que falte
      # (plataforma, build-tools) una vez aceptadas las licencias.
      - name: Licencias del SDK de Android
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)" --licenses > /dev/null || true

      - name: NDK (para compilar Stockfish)
        run: |
          ndk=$(grep '^ndk = ' android/gradle/libs.versions.toml | cut -d'"' -f2)
          "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)" --install "ndk;$ndk" > /dev/null

      - name: Clave de firma
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Tests y APK
        working-directory: android
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :core:chess:test :vision:testDebugUnitTest :engine:testDebugUnitTest \
            :feature:camera:testDebugUnitTest :feature:board:testDebugUnitTest :maia:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          python3 scripts/check_16kb.py app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "../pawneyes-$VERSION.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: pawneyes-*.apk
          body_path: notas.md
